<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0118bd">
<title>Stock Count · doblexo</title>
<style>
:root{
  --blue:#0118bd; --pink:#FA7DE1; --ink:#0b0b1a; --bg:#ffffff;
  --soft:#eef0fb; --line:#4a4f72; --red:#a8001c; --green:#065f2a;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:22px;line-height:1.35}
button{font:inherit;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Header */
header{position:sticky;top:0;z-index:5;background:var(--blue);color:#fff;
  display:flex;align-items:center;gap:14px;padding:12px 18px;flex-wrap:wrap}
header h1{font-size:32px;margin:0 auto 0 4px;font-weight:800;letter-spacing:.2px}
.hbtn{min-height:64px;min-width:64px;padding:0 22px;border-radius:14px;border:3px solid #fff;
  background:transparent;color:#fff;font-weight:700;font-size:22px;text-decoration:none;
  display:inline-flex;align-items:center;justify-content:center;gap:8px}
.hbtn:focus-visible{outline:4px solid var(--pink);outline-offset:3px}
.logo-home{width:84px;height:84px;border-radius:16px;background:#fff;display:inline-flex;align-items:center;justify-content:center;padding:4px;flex:none}
.logo-home img{width:100%;height:100%;display:block}
.logo-home:focus-visible{outline:4px solid var(--pink);outline-offset:3px}
.tabs{display:flex;gap:10px}
.tab{min-height:64px;padding:0 26px;border-radius:14px;border:3px solid #fff;background:transparent;
  color:#fff;font-weight:800;font-size:24px}
.tab[aria-pressed="true"]{background:var(--pink);color:var(--ink);border-color:var(--pink)}
.tab:focus-visible{outline:4px solid #fff;outline-offset:3px}

/* Status bar */
.bar{display:flex;align-items:center;gap:14px;padding:12px 18px;background:var(--soft);
  border-bottom:2px solid var(--line);flex-wrap:wrap}
#status{flex:1;font-weight:700;font-size:22px;min-height:30px}
#status.ok{color:var(--green)} #status.warn{color:var(--red)}
.btn{min-height:64px;padding:0 24px;border-radius:14px;border:3px solid var(--blue);
  background:#fff;color:var(--blue);font-weight:800;font-size:22px}
.btn.primary{background:var(--blue);color:#fff}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.btn:disabled{opacity:.55;cursor:default}

main{padding:8px 18px 120px;max-width:1200px;margin:0 auto}
h2.sec{font-size:26px;margin:26px 0 8px;padding:6px 14px;border-left:10px solid var(--pink);
  background:var(--soft);border-radius:6px}

/* Count rows */
.row{display:flex;align-items:center;gap:16px;padding:12px 4px;border-bottom:2px solid #d4d7ea;min-height:92px}
.name{flex:1;min-width:0}
.iname{display:block;font-size:28px;font-weight:700}
.meta{display:block;font-size:20px;color:#33385a}
.need{font-size:22px;font-weight:800;padding:8px 14px;border-radius:10px;
  background:var(--pink);color:var(--ink);white-space:nowrap}
.ok-chip{font-size:20px;font-weight:700;color:var(--green);white-space:nowrap}
.countbox{width:170px;min-height:76px;border:4px solid var(--blue);border-radius:14px;background:#fff;
  color:var(--ink);font-size:34px;font-weight:800;display:flex;flex-direction:column;
  align-items:center;justify-content:center;line-height:1.05;padding:4px}
.countbox small{font-size:16px;font-weight:600;color:#33385a}
.countbox.empty{background:var(--soft);color:#33385a;font-size:22px;border-style:dashed}
.countbox.unsaved{border-color:var(--red)}
.unsaved-tag{display:block;font-size:16px;color:var(--red);font-weight:800}

/* Order list */
.orow{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:14px 4px;
  border-bottom:2px solid #d4d7ea;font-size:26px}
.orow b{font-size:30px}
.orow .sub{font-size:19px;color:#33385a;display:block}
.note{background:#fff4d6;border:2px solid #8a6100;color:#3d2b00;border-radius:12px;padding:12px 16px;margin:16px 0;font-size:21px}
.empty-msg{font-size:28px;font-weight:700;text-align:center;padding:50px 10px}

/* Overlays */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(5,8,40,.72);display:flex;align-items:center;justify-content:center;padding:14px}
.panel{background:#fff;border-radius:22px;padding:22px;width:min(560px,100%);max-height:100%;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.panel h2{margin:0 0 4px;font-size:30px}
.panel .sub{font-size:21px;color:#33385a;margin:0 0 12px}
.display{font-size:56px;font-weight:800;text-align:center;border:4px solid var(--blue);border-radius:16px;
  padding:6px 10px;margin:8px 0 14px;min-height:86px;letter-spacing:2px}
.display .unit{font-size:24px;font-weight:600;color:#33385a;letter-spacing:0}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.key{min-height:84px;border-radius:16px;border:3px solid var(--line);background:var(--soft);
  font-size:38px;font-weight:800;color:var(--ink)}
.key:active{background:var(--pink)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.actions .btn{min-height:76px;font-size:24px}
.actions .wide{grid-column:1/-1}
.err{color:var(--red);font-weight:800;font-size:22px;min-height:30px;text-align:center;margin:0 0 6px}
#pinScreen{background:var(--blue)}
#pinScreen .panel h2{text-align:center}
.dots{font-size:60px;text-align:center;letter-spacing:14px;min-height:86px;margin:6px 0 10px}
</style>
</head>

    </div>

<script>
(function(){
"use strict";
var API = 'https://script.google.com/macros/s/AKfycbzmt25VyHeq2bE5u4vXUt1_UeqUy8B5X0f5-h2mDguPk7AZD32uN15kznFstzdR9pM/exec';
var PIN_KEY = 'doblexo_stock_pin', QUEUE_KEY = 'doblexo_stock_pending';

var items = [];        // {section,item,count}
var ordered = [];      // items in on-screen order
var view = 'count';
var pending = {};      // item name -> count waiting to save
var flushing = false, retryTimer = null, loaded = false;

function $(id){ return document.getElementById(id); }
function get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function put(k,v){ try{ if(v==null) localStorage.removeItem(k); else localStorage.setItem(k,v); }catch(e){} }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function num(v){ if(v===''||v==null) return null; var n=Number(v); return isFinite(n)?n:null; }
function fmt(n){ return (Math.round(n*100)/100).toString(); }

try{ pending = JSON.parse(get(QUEUE_KEY)||'{}')||{}; }catch(e){ pending={}; }
function savePending(){ put(QUEUE_KEY, JSON.stringify(pending)); }

function setStatus(text, kind){ var s=$('status'); s.textContent=text; s.className=kind||''; }

/* ---------- API ---------- */
function BadPin(){}
function api(body){
  body.pin = get(PIN_KEY) || '';
  return fetch(API, { method:'POST', body: JSON.stringify(body) })   // text/plain: no CORS preflight
    .catch(function(){ throw new Error('NET'); })
    .then(function(r){
      if(!r.ok) throw new Error('The script answered with error '+r.status+'.');
      return r.text().then(function(t){
        try{ return JSON.parse(t); }
        catch(e){ throw new Error('The script sent back a web page instead of data — it may still be running old code, or access isn’t set to “Anyone”.'); }
      });
    })
    .then(function(d){
      if(d && d.ok) return d;
      if(d && /pin/i.test(String(d.error||''))){ put(PIN_KEY,null); showPin('That PIN didn’t work. Try again.'); throw new BadPin(); }
      throw new Error('The script says: '+((d && d.error) || 'unexpected reply'));
    });
}

function applyItems(list){
  items = (list||[]).map(function(r){
    return { section:String(r.section||'Other'), item:String(r.item||''), count:num(r.count) };
  }).filter(function(r){ return r.item; });
  for(var name in pending){ var it=find(name); if(it) it.count = pending[name]; }
}
function find(name){ for(var i=0;i<items.length;i++) if(items[i].item===name) return items[i]; return null; }

function load(quiet){
  if(!quiet) setStatus('Loading…');
  $('retryBtn').classList.add('hidden');
  return api({action:'load'}).then(function(d){
    applyItems(d.items); loaded = true; render();
    if(Object.keys(pending).length) flush(); else setStatus('All changes saved', 'ok');
  }).catch(function(e){
    if(e instanceof BadPin) return;
    if(!loaded){ $('main').innerHTML = '<p class="empty-msg">Couldn’t load the counts.</p>'; }
    setStatus(why(e), 'warn');
    $('retryBtn').classList.remove('hidden');
  });
}

function flush(){
  if(flushing) return;
  var names = Object.keys(pending);
  if(!names.length){ setStatus('All changes saved', 'ok'); return; }
  flushing = true; setStatus('Saving…');
  var name = names[0], val = pending[name];
  api({action:'set', item:name, count: val==null?'':val}).then(function(){
    if(pending[name]===val){ delete pending[name]; savePending(); }
    flushing = false; render(); flush();
  }).catch(function(e){
    flushing = false;
    if(e instanceof BadPin) return;
    setStatus('Not saved yet, will keep trying. '+why(e), 'warn');
    clearTimeout(retryTimer); retryTimer = setTimeout(flush, 8000);
    render();
  });
}

function why(e){
  if(!e || e.message==='NET') return navigator.onLine===false
    ? 'This tablet is offline — check the Wi-Fi.'
    : 'Can’t reach the script. If the Wi-Fi is fine, check the script is deployed with access “Anyone”.';
  return e.message;
}
function setCount(it, val){
  it.count = val; pending[it.item] = val; savePending(); render(); flush();
}

/* ---------- Rendering ---------- */
function groups(){
  var order=[], map={};
  items.forEach(function(it){ if(!map[it.section]){ map[it.section]=[]; order.push(it.section); } map[it.section].push(it); });
  return order.map(function(s){ return {name:s, list:map[s]}; });
}

function render(){
  if(!loaded) return;
  $('tabCount').setAttribute('aria-pressed', view==='count');
  $('tabOrder').setAttribute('aria-pressed', view==='order');
  $('copyBtn').classList.toggle('hidden', view!=='order');
  $('newCountBtn').classList.toggle('hidden', view!=='count');
  var g = groups(), h = '';
  ordered = [];
  if(!items.length){ $('main').innerHTML = '<p class="empty-msg">No items in the sheet yet.</p>'; return; }

  if(view==='count'){
    g.forEach(function(sec){
      h += '<section aria-label="'+esc(sec.name)+'"><h2 class="sec">'+esc(sec.name)+'</h2>';
      sec.list.forEach(function(it){
        var i = ordered.push(it)-1, uns = (it.item in pending);
        var label = it.item+', on hand: '+(it.count==null?'not counted':fmt(it.count))+(uns?', not saved yet':'')+'. Tap to change.';
        h += '<div class="row"><div class="name"><span class="iname">'+esc(it.item)+'</span></div>'+
             '<button class="countbox'+(it.count==null?' empty':'')+(uns?' unsaved':'')+'" data-i="'+i+'" aria-label="'+esc(label)+'">'+
             (it.count==null ? 'Tap to count' : fmt(it.count))+
             (uns?'<span class="unsaved-tag">not saved</span>':'')+'</button></div>';
      });
      h += '</section>';
    });
  } else {
    var notCounted=items.filter(function(it){return it.count==null;}).length;
    if(notCounted) h += '<p class="note">'+notCounted+' item'+(notCounted>1?'s':'')+' not counted yet.</p>';
    g.forEach(function(sec){
      h += '<section aria-label="'+esc(sec.name)+'"><h2 class="sec">'+esc(sec.name)+'</h2>';
      sec.list.forEach(function(it){
        h += '<div class="orow"><span>'+esc(it.item)+'</span><b>'+(it.count==null?'<span class="sub">not counted</span>':fmt(it.count))+'</b></div>';
      });
      h += '</section>';
    });
    var any = true;
    $('copyBtn').disabled = !any;
  }
  var focusI = document.activeElement && document.activeElement.getAttribute('data-i');
  $('main').innerHTML = h;
  if(focusI!=null){ var b=document.querySelector('.countbox[data-i="'+focusI+'"]'); if(b) b.focus(); }
}

function orderText(){
  var d = new Date(), lines = ['doblexo stock count — '+d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})];
  groups().forEach(function(sec){
    lines.push('', sec.name.toUpperCase());
    sec.list.forEach(function(it){ lines.push('- '+it.item+': '+(it.count==null?'not counted':fmt(it.count))); });
  });
  return lines.join('\n');
}
function copyText(t){
  function fallback(){
    var ta=document.createElement('textarea'); ta.value=t; ta.setAttribute('readonly','');
    ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select();
    var ok=false; try{ ok=document.execCommand('copy'); }catch(e){} document.body.removeChild(ta); return ok;
  }
  if(navigator.clipboard && window.isSecureContext){
    return navigator.clipboard.writeText(t).then(function(){return true;}, function(){ return fallback(); });
  }
  return Promise.resolve(fallback());
}

/* ---------- Count keypad ---------- */
var padIndex = -1, padVal = '';
function buildKeys(el, extra){
  ['1','2','3','4','5','6','7','8','9',extra,'0','⌫'].forEach(function(k){
    var b=document.createElement('button'); b.className='key'; b.textContent=k; b.setAttribute('data-k',k);
    if(k==='⌫') b.setAttribute('aria-label','Delete');
    if(k==='.') b.setAttribute('aria-label','Decimal point');
    if(k==='') b.style.visibility='hidden';
    el.appendChild(b);
  });
}
buildKeys($('padKeys'), '.');
buildKeys($('pinKeys'), '');

function openPad(i){
  padIndex = i; var it = ordered[i];
  padVal = it.count==null ? '' : fmt(it.count);
  $('padTitle').textContent = it.item;
  $('padSub').textContent = 'How many on hand right now?';
  $('padNext').classList.toggle('hidden', i>=ordered.length-1);
  drawPad();
  $('padOverlay').classList.remove('hidden');
  $('padSave').focus();
}
function drawPad(){
  var it = ordered[padIndex];
  $('padDisplay').innerHTML = (padVal===''?'<span class="unit">Type a number</span>':esc(padVal));
}
function padKey(k){
  if(k==='⌫') padVal = padVal.slice(0,-1);
  else if(k==='.'){ if(padVal.indexOf('.')<0) padVal = (padVal||'0')+'.'; }
  else if(/^\d$/.test(k)){ if(padVal.replace('.','').length<6) padVal = (padVal==='0'?'':padVal)+k; }
  drawPad();
}
function closePad(){
  $('padOverlay').classList.add('hidden');
  var b=document.querySelector('.countbox[data-i="'+padIndex+'"]'); if(b) b.focus();
}
function savePad(next){
  var it = ordered[padIndex], v = padVal==='' || padVal==='.' ? null : Number(padVal);
  if(v!==it.count) setCount(it, v);
  if(next && padIndex < ordered.length-1) openPad(padIndex+1); else closePad();
}
$('padKeys').addEventListener('click', function(e){ var k=e.target.getAttribute('data-k'); if(k!=null) padKey(k); });
$('padCancel').onclick = closePad;
$('padBlank').onclick = function(){ padVal=''; savePad(false); };
$('padSave').onclick = function(){ savePad(false); };
$('padNext').onclick = function(){ savePad(true); };

/* ---------- PIN screen ---------- */
var pinVal = '';
function showPin(msg){
  pinVal=''; drawPin(); $('pinErr').textContent = msg||'';
  $('padOverlay').classList.add('hidden');
  $('pinScreen').classList.remove('hidden');
  $('pinEnter').focus();
}
function drawPin(){
  $('pinDots').textContent = pinVal.replace(/./g,'●');
  $('pinDots').setAttribute('aria-label', pinVal.length ? pinVal.length+' digit'+(pinVal.length>1?'s':'')+' entered' : 'No digits entered');
  $('pinEnter').disabled = !pinVal.length;
}
function pinKey(k){
  if(k==='⌫') pinVal = pinVal.slice(0,-1);
  else if(/^\d$/.test(k) && pinVal.length<10) pinVal += k;
  $('pinErr').textContent=''; drawPin();
}
function submitPin(){
  if(!pinVal) return;
  put(PIN_KEY, pinVal);
  $('pinScreen').classList.add('hidden');
  load();
}
$('pinKeys').addEventListener('click', function(e){ var k=e.target.getAttribute('data-k'); if(k) pinKey(k); });
$('pinEnter').onclick = submitPin;

/* ---------- Start new count (two taps) ---------- */
var armTimer = null;
$('newCountBtn').onclick = function(){
  var b = this;
  if(!b.classList.contains('danger')){
    b.classList.add('danger'); b.textContent = 'Tap again to clear all counts';
    clearTimeout(armTimer);
    armTimer = setTimeout(function(){ b.classList.remove('danger'); b.textContent='Start new count'; }, 5000);
    return;
  }
  clearTimeout(armTimer); b.classList.remove('danger'); b.textContent='Clearing…'; b.disabled = true;
  setStatus('Clearing counts…');
  api({action:'clear'}).then(function(d){
    pending = {}; savePending(); applyItems(d.items); render();
    setStatus('New count started — all counts cleared', 'ok');
  }).catch(function(e){
    if(!(e instanceof BadPin)) setStatus('Couldn’t clear. '+why(e), 'warn');
  }).then(function(){ b.disabled=false; b.textContent='Start new count'; });
};

/* ---------- Other wiring ---------- */
$('main').addEventListener('click', function(e){
  var b = e.target.closest('.countbox'); if(b) openPad(Number(b.getAttribute('data-i')));
});
$('tabCount').onclick = function(){ view='count'; render(); };
$('tabOrder').onclick = function(){ view='order'; render(); };
$('retryBtn').onclick = function(){ load(); };
$('copyBtn').onclick = function(){
  copyText(orderText()).then(function(ok){
    setStatus(ok ? 'Counts copied — paste them into a text or email' : 'Couldn’t copy on this tablet', ok?'ok':'warn');
  });
};
document.addEventListener('keydown', function(e){
  if(!$('pinScreen').classList.contains('hidden')){
    if(/^\d$/.test(e.key)) pinKey(e.key); else if(e.key==='Backspace') pinKey('⌫'); else if(e.key==='Enter'){ e.preventDefault(); submitPin(); }
    return;
  }
  if(!$('padOverlay').classList.contains('hidden')){
    if(/^[\d.]$/.test(e.key)) padKey(e.key);
    else if(e.key==='Backspace') padKey('⌫');
    else if(e.key==='Escape') closePad();
    else if(e.key==='Enter' && e.target.tagName!=='BUTTON'){ savePad(true); }
  }
});
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState==='visible' && get(PIN_KEY) && !flushing && !Object.keys(pending).length) load(true);
});

if(get(PIN_KEY)) load(); else { setStatus(''); showPin(''); }
})();
</script>
</body>
</html>
