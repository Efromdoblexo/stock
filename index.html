<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>doblexo · Stock Count</title>
<style>
  :root{
    --blue:#0118bd;      /* doblexo yves klein blue */
    --pink:#FA7DE1;      /* doblexo pink flamingo */
    --ink:#0b0b14;
    --paper:#ffffff;
    --soft:#eef0fb;
    --line:#5a5f80;
    --warn:#8a0000;
    --ok:#05612b;
    --focus:#ffbf00;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);
    font:22px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-tap-highlight-color:transparent}
  button{font:inherit;color:inherit;cursor:pointer}
  :focus-visible{outline:5px solid var(--focus);outline-offset:3px}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  /* Header */
  header{position:sticky;top:0;z-index:5;background:var(--blue);color:#fff;
    padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .home{min-height:64px;min-width:64px;padding:0 20px;border-radius:14px;border:3px solid #fff;
    background:transparent;color:#fff;font-weight:700;font-size:24px;text-decoration:none;
    display:inline-flex;align-items:center;gap:8px}
  h1{margin:0;font-size:32px;flex:1;min-width:200px}
  h1 small{display:block;font-size:18px;font-weight:600;color:var(--pink)}
  .status{font-size:20px;font-weight:700;padding:8px 14px;border-radius:999px;background:#fff;color:var(--ink)}
  .status.bad{background:#ffe1e1;color:var(--warn)}
  .tabs{display:flex;gap:10px;width:100%}
  .tab{flex:1;min-height:68px;border-radius:14px;border:3px solid #fff;background:transparent;
    color:#fff;font-size:26px;font-weight:800}
  .tab[aria-selected="true"]{background:#fff;color:var(--blue)}

  main{padding:16px 16px 140px;max-width:1100px;margin:0 auto}
  h2{font-size:28px;margin:28px 0 10px;padding-bottom:6px;border-bottom:4px solid var(--blue);color:var(--blue)}
  .note{font-size:20px;padding:14px 16px;border-radius:12px;background:var(--soft);border-left:8px solid var(--blue);margin:12px 0}

  /* Count rows */
  .row{display:flex;align-items:center;gap:16px;width:100%;min-height:84px;margin:10px 0;
    padding:10px 12px 10px 18px;border:3px solid var(--line);border-radius:16px;background:#fff;text-align:left}
  .row:active{background:var(--soft)}
  .row .name{flex:1;font-size:28px;font-weight:700}
  .row .val{min-width:140px;min-height:64px;padding:0 14px;border:3px solid var(--blue);border-radius:12px;
    display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800;color:var(--blue);background:var(--soft)}
  .row .val.empty{color:#33374f;font-size:22px;font-weight:700;background:#fff;border-style:dashed}

  /* Footer actions */
  .bar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:#fff;border-top:4px solid var(--blue);
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;gap:12px;justify-content:center}
  .bar[hidden],[hidden]{display:none !important}
  .big{min-height:76px;padding:0 28px;border-radius:16px;font-size:26px;font-weight:800;border:3px solid var(--blue);
    background:var(--blue);color:#fff;flex:1;max-width:560px}
  .big.ghost{background:#fff;color:var(--blue)}
  .big.danger{background:var(--warn);border-color:var(--warn);color:#fff}

  /* Order list */
  .order-item{display:flex;justify-content:space-between;gap:16px;font-size:26px;padding:14px 4px;border-bottom:2px solid #c9cce0}
  .order-item b{font-weight:800}
  .order-item .qty{font-weight:800;color:var(--blue);white-space:nowrap;text-align:right;min-width:90px}
  .order-item .qty.missing{color:#33374f;font-size:22px;font-style:italic}

  /* Overlays */
  .overlay{position:fixed;inset:0;z-index:20;background:rgba(5,8,40,.75);display:flex;align-items:center;justify-content:center;padding:12px}
  .overlay[hidden]{display:none}
  .sheet{background:#fff;border-radius:22px;width:100%;max-width:560px;padding:20px;box-shadow:0 10px 40px rgba(0,0,0,.4)}
  .sheet h3{margin:0 0 4px;font-size:30px}
  .sheet .sub{font-size:20px;color:#33374f;font-weight:600;margin-bottom:12px}
  .display{font-size:56px;font-weight:800;text-align:center;min-height:90px;line-height:84px;border:4px solid var(--blue);
    border-radius:14px;margin-bottom:14px;letter-spacing:.04em;color:var(--blue);background:var(--soft)}
  .display.placeholder{color:#33374f;font-size:28px}
  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .key{min-height:84px;border-radius:16px;border:3px solid var(--ink);background:#fff;font-size:38px;font-weight:800}
  .key:active{background:var(--soft)}
  .key.fn{font-size:24px}
  .pad-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
  .pad-actions .big{max-width:none}
  .err{color:var(--warn);font-weight:800;font-size:22px;min-height:30px;text-align:center;margin:4px 0 8px}

  #pinScreen{background:var(--blue)}
  #pinScreen .sheet h3{color:var(--blue)}
  .dots{display:flex;justify-content:center;gap:16px;margin:10px 0 14px}
  .dot{width:30px;height:30px;border-radius:50%;border:4px solid var(--blue)}
  .dot.on{background:var(--blue)}

  .toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);z-index:30;background:var(--ink);color:#fff;
    padding:16px 26px;border-radius:14px;font-size:24px;font-weight:700}
  .toast[hidden]{display:none}
  @media (max-width:600px){ .row .name{font-size:24px} .row .val{min-width:110px} h1{font-size:26px} }
  @media (prefers-reduced-motion:no-preference){ .row,.key,.big{transition:background .1s} }
</style>
</head>
<body>

<header>
  <a class="home" href="https://claude.ai/artifact/54Ku9KpnNneb67haDzVzqZ" aria-label="Home, back to launcher">⌂ Home</a>
  <h1>Stock Count <small>doblexo</small></h1>
  <span id="status" class="status" role="status" aria-live="polite">Loading…</span>
  <div class="tabs" role="tablist" aria-label="Views">
    <button class="tab" id="tabCount" role="tab" aria-selected="true" aria-controls="viewCount">Count</button>
    <button class="tab" id="tabOrder" role="tab" aria-selected="false" aria-controls="viewOrder">Summary</button>
  </div>
</header>

<main>
  <section id="viewCount" role="tabpanel" aria-labelledby="tabCount"></section>
  <section id="viewOrder" role="tabpanel" aria-labelledby="tabOrder" hidden></section>
</main>

<div class="bar" id="barCount">
  <button class="big ghost" id="newCountBtn">Start new count</button>
</div>
<div class="bar" id="barOrder" hidden>
  <button class="big" id="copyBtn">Copy summary</button>
</div>

<!-- Count keypad -->
<div class="overlay" id="countPad" hidden role="dialog" aria-modal="true" aria-labelledby="padTitle">
  <div class="sheet">
    <h3 id="padTitle">Item</h3>
    <div class="sub" id="padSub"></div>
    <div class="display" id="padDisplay" aria-live="polite"></div>
    <div class="pad" id="padKeys"></div>
    <div class="pad-actions">
      <button class="big ghost" id="padCancel">Cancel</button>
      <button class="big" id="padSave">Save</button>
    </div>
    <div class="pad-actions">
      <button class="big ghost" id="padBlank">Not counted</button>
      <button class="big" id="padNext">Save &amp; next ›</button>
    </div>
  </div>
</div>

<!-- PIN screen -->
<div class="overlay" id="pinScreen" hidden role="dialog" aria-modal="true" aria-labelledby="pinTitle">
  <div class="sheet">
    <h3 id="pinTitle">Enter shop PIN</h3>
    <div class="sub">Asked once on this tablet.</div>
    <div class="dots" id="pinDots" aria-hidden="true"></div>
    <span class="sr" id="pinCount" aria-live="polite"></span>
    <div class="err" id="pinErr" role="alert"></div>
    <div class="pad" id="pinKeys"></div>
    <div class="pad-actions" style="grid-template-columns:1fr">
      <button class="big" id="pinGo">Unlock</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden role="status" aria-live="polite"></div>

<script>
(function(){
  "use strict";
  var API = "https://script.google.com/macros/s/AKfycby-QoGvtropx6WSiv9u0OkS4xCgR44a4VlVSbWHqBW0T-th2sjB9tT0_yRjiuBhn8sK/exec";

  /* Fallback item list (from the inventory sheet). If the sheet has a Section column,
     the script sends it and it replaces these sections. */
  var DEFAULT_ITEMS = [
    {name:"Whole milk", section:"Milk & Dairy"},
    {name:"Fat free milk", section:"Milk & Dairy"},
    {name:"Oat milk", section:"Milk & Dairy"},
    {name:"Almond milk", section:"Milk & Dairy"},
    {name:"Heavy creams", section:"Milk & Dairy"},
    {name:"Lechera", section:"Milk & Dairy"},
    {name:"Vanilla bean honey", section:"Sweeteners"},
    {name:"Traditional honey", section:"Sweeteners"},
    {name:"Brown sugar", section:"Sweeteners"},
    {name:"Cane sugar", section:"Sweeteners"},
    {name:"Agave", section:"Sweeteners"},
    {name:"Biscoff cookies", section:"Toppings"},
    {name:"Graham crackers", section:"Toppings"},
    {name:"Fruity pebbles", section:"Toppings"},
    {name:"Espresso Beans", section:"Coffee & Matcha"},
    {name:"Cold brew beans", section:"Coffee & Matcha"},
    {name:"Cold brew concentrate", section:"Coffee & Matcha"},
    {name:"Matcha", section:"Coffee & Matcha"}
  ];

  var items = DEFAULT_ITEMS.slice();
  var counts = {};         // name -> number (missing = not counted)
  var pending = {};        // name -> number|"" waiting to be saved
  var pin = store("get","stockPin") || "";
  var retryTimer = null, busy = false, view = "count";

  function $(id){ return document.getElementById(id); }
  function store(op,k,v){ try{ if(op==="get") return localStorage.getItem(k);
    if(op==="set") localStorage.setItem(k,v); if(op==="del") localStorage.removeItem(k);}catch(e){} return null; }
  function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
  function num(v){ if(v===""||v===null||v===undefined) return null; var n=Number(v); return isFinite(n)?n:null; }
  function fmt(n){ return (Math.round(n*100)/100).toString(); }

  /* ---------- Server ---------- */
  function call(body){
    body.pin = pin;
    return fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify(body),redirect:"follow"})
      .catch(function(){ var e=new Error("network"); e.kind="network"; throw e; })
      .then(function(r){ return r.text(); })
      .then(function(t){
        var d; try{ d=JSON.parse(t); }catch(x){
          var e=new Error("notjson"); e.kind=/sign in|accounts\.google|ServiceLogin/i.test(t)?"signin":"notjson"; throw e; }
        if(isBadPin(d)){ var e2=new Error("bad_pin"); e2.badPin=true; throw e2; }
        if(d && d.ok===false){ var e3=new Error(d.error||"Script error"); e3.kind="script"; throw e3; }
        return d;
      });
  }
  function explain(e){
    if(!e) return "Something went wrong. Try again.";
    if(e.kind==="network") return "Can't reach the script. Check Wi-Fi, then try again.";
    if(e.kind==="signin") return "The script is asking for a Google sign-in. Redeploy it with access set to \u201cAnyone\u201d.";
    if(e.kind==="notjson") return "The script didn't send stock data back. Make sure the new Code.gs is deployed as a new version.";
    if(e.kind==="script") return "Script error: "+e.message;
    return e.message||"Something went wrong.";
  }
  function isBadPin(d){
    if(!d) return false;
    var s=((d.error||"")+" "+(d.message||"")+" "+(d.status||"")).toLowerCase();
    if(/not set/.test(s)) return false;
    return d.ok===false && /bad_pin|bad pin|wrong pin|invalid pin|incorrect pin|unauth|forbidden|denied/.test(s);
  }
  function handleErr(e){
    if(e && e.badPin){ pin=""; store("del","stockPin"); showPin("That PIN didn't work. Try again."); return; }
    setStatus("Not saved – retrying", true); toast(explain(e));
    scheduleRetry();
  }

  function load(){
    setStatus("Loading…");
    return call({action:"get"}).then(function(d){
      applyServer(d); store("set","stockPin",pin); hidePin();
      setStatus("Up to date"); render(); flush();
    });
  }
  function applyServer(d){
    var list = d.items || d.data || null;
    var newCounts = {};
    if(Array.isArray(list) && list.length){
      var fromSheet = [];
      list.forEach(function(r){
        var name = r.name||r.item||r.Item; if(!name) return;
        var def = DEFAULT_ITEMS.filter(function(x){return x.name===name;})[0] || {};
        fromSheet.push({name:name,
          section: r.section||r.Section||def.section||"Other"});
        var c = num(r.count!==undefined?r.count:r.Count); if(c!==null) newCounts[name]=c;
      });
      items = fromSheet;
    } else if(d.counts && typeof d.counts==="object"){
      Object.keys(d.counts).forEach(function(k){ var c=num(d.counts[k]); if(c!==null) newCounts[k]=c; });
    }
    // keep unsaved local edits on top of server data
    Object.keys(pending).forEach(function(k){ if(pending[k]==="") delete newCounts[k]; else newCounts[k]=pending[k]; });
    counts = newCounts;
    store("set","stockCache",JSON.stringify({items:items,counts:counts}));
  }

  function saveCount(name,val){
    if(val===null){ delete counts[name]; pending[name]=""; } else { counts[name]=val; pending[name]=val; }
    store("set","stockCache",JSON.stringify({items:items,counts:counts}));
    render(); flush();
  }
  function flush(){
    if(busy) return;
    var keys = Object.keys(pending);
    if(!keys.length){ setStatus("All saved"); return; }
    busy = true; setStatus("Saving…");
    var name = keys[0], val = pending[name];
    call({action:"set",item:name,count:val}).then(function(){
      if(pending[name]===val) delete pending[name];
      busy=false; flush();
    }).catch(function(e){ busy=false; handleErr(e); });
  }
  function scheduleRetry(){
    clearTimeout(retryTimer);
    retryTimer = setTimeout(function(){ if(Object.keys(pending).length) flush(); else load().catch(handleErr); }, 15000);
  }
  window.addEventListener("online", function(){ flush(); });

  function clearAll(){
    setStatus("Clearing…");
    call({action:"clear"}).then(function(){
      counts={}; pending={}; store("set","stockCache",JSON.stringify({items:items,counts:counts}));
      render(); setStatus("New count started"); toast("Counts cleared. New count started.");
    }).catch(function(e){
      if(e && e.badPin) return handleErr(e);
      setStatus("Could not clear", true); toast("Could not clear. Check Wi-Fi and try again.");
    });
  }

  function setStatus(t,bad){ var s=$("status"); s.textContent=t; s.className="status"+(bad?" bad":""); }
  function toast(t){ var el=$("toast"); el.textContent=t; el.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(function(){el.hidden=true;},3000); }

  /* ---------- Order logic ---------- */
  function sections(list){
    var order=[], map={};
    list.forEach(function(it){ var s=it.section||"Other"; if(!map[s]){map[s]=[];order.push(s);} map[s].push(it); });
    return order.map(function(s){return {name:s,items:map[s]};});
  }

  /* ---------- Render ---------- */
  function render(){
    var html="", uncounted=0;
    sections(items).forEach(function(sec){
      html += '<h2>'+esc(sec.name)+'</h2>';
      sec.items.forEach(function(it){
        var c=counts[it.name], has=c!==undefined;
        if(!has) uncounted++;
        html += '<button class="row" data-item="'+esc(it.name)+'" aria-label="'+esc(it.name)+', '+(has?'on shelf '+fmt(c):'not counted')+'. Tap to enter count.">'+
          '<span class="name">'+esc(it.name)+'</span>'+
          '<span class="val'+(has?'':' empty')+'">'+(has?fmt(c):'Tap to count')+'</span></button>';
      });
    });
    if(uncounted) html = '<div class="note"><b>'+uncounted+'</b> of '+items.length+' items not counted yet.</div>'+html;
    $("viewCount").innerHTML = html;

    // Summary view: every item and how much is on hand
    var oh="";
    sections(items).forEach(function(sec){
      oh+='<h2>'+esc(sec.name)+'</h2>';
      sec.items.forEach(function(it){
        var c=counts[it.name];
        oh+='<div class="order-item"><b>'+esc(it.name)+'</b><span class="qty'+(c===undefined?' missing':'')+'">'+(c===undefined?'Not counted':fmt(c))+'</span></div>';
      });
    });
    if(uncounted) oh='<div class="note"><b>'+uncounted+'</b> of '+items.length+' items not counted yet.</div>'+oh;
    $("viewOrder").innerHTML = oh;
  }

  function orderText(){
    var lines=["doblexo stock count – "+new Date().toLocaleDateString()];
    sections(items).forEach(function(sec){
      lines.push("", sec.name.toUpperCase());
      sec.items.forEach(function(it){
        var c=counts[it.name];
        lines.push("- "+it.name+": "+(c===undefined?"not counted":fmt(c)));
      });
    });
    return lines.join("\n");
  }
  function copyText(t){
    function fallback(){
      var ta=document.createElement("textarea"); ta.value=t; ta.setAttribute("readonly","");
      ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select();
      var ok=false; try{ ok=document.execCommand("copy"); }catch(e){} document.body.removeChild(ta); return ok;
    }
    if(navigator.clipboard && window.isSecureContext){
      return navigator.clipboard.writeText(t).then(function(){return true;},function(){return fallback();});
    }
    return Promise.resolve(fallback());
  }

  /* ---------- Tabs ---------- */
  function show(v){
    view=v;
    $("tabCount").setAttribute("aria-selected", v==="count"); $("tabOrder").setAttribute("aria-selected", v==="order");
    $("viewCount").hidden = v!=="count"; $("viewOrder").hidden = v!=="order";
    $("barCount").hidden = v!=="count"; $("barOrder").hidden = v!=="order";
    window.scrollTo(0,0);
  }
  $("tabCount").onclick=function(){show("count");};
  $("tabOrder").onclick=function(){show("order");};
  $("copyBtn").onclick=function(){
    copyText(orderText()).then(function(ok){ toast(ok?"Summary copied.":"Couldn't copy on this device."); });
  };

  /* ---------- Start new count (two taps) ---------- */
  var armTimer=null;
  $("newCountBtn").onclick=function(){
    var b=this;
    if(b.dataset.armed){ clearTimeout(armTimer); disarm(); clearAll(); return; }
    b.dataset.armed="1"; b.className="big danger"; b.textContent="Tap again to clear all counts";
    armTimer=setTimeout(disarm,5000);
  };
  function disarm(){ var b=$("newCountBtn"); delete b.dataset.armed; b.className="big ghost"; b.textContent="Start new count"; }

  /* ---------- Count keypad ---------- */
  var padItem=null, padVal="";
  function buildPad(el, keys, onKey){
    el.innerHTML = keys.map(function(k){
      var label = k==="back"?"⌫":k, aria = k==="back"?"Delete":k==="."?"Decimal point":k;
      return '<button class="key'+(k==="back"?" fn":"")+'" data-k="'+k+'" aria-label="'+aria+'">'+label+'</button>';
    }).join("");
    el.onclick=function(e){ var b=e.target.closest(".key"); if(b) onKey(b.dataset.k); };
  }
  buildPad($("padKeys"), ["1","2","3","4","5","6","7","8","9",".","0","back"], function(k){
    if(k==="back") padVal=padVal.slice(0,-1);
    else if(k==="."){ if(padVal.indexOf(".")<0) padVal=(padVal||"0")+"."; }
    else if(padVal.length<7) padVal = (padVal==="0"?"":padVal)+k;
    drawPad();
  });
  function drawPad(){
    var d=$("padDisplay");
    if(padVal===""){ d.textContent="Type amount"; d.className="display placeholder"; }
    else { d.textContent=padVal; d.className="display"; }
  }
  function openPad(name){
    var it=items.filter(function(x){return x.name===name;})[0]; if(!it) return;
    padItem=it; padVal = counts[name]!==undefined ? fmt(counts[name]) : "";
    $("padTitle").textContent=it.name;
    $("padSub").textContent="What's on the shelf now?";
    drawPad(); $("countPad").hidden=false; $("padSave").focus();
  }
  function closePad(){ $("countPad").hidden=true; var r=padItem&&document.querySelector('.row[data-item="'+CSS.escape(padItem.name)+'"]'); padItem=null; if(r) r.focus(); }
  function commit(){ if(!padItem) return; var v=padVal===""?null:num(padVal.replace(/\.$/,"")); saveCount(padItem.name,v); }
  $("viewCount").addEventListener("click",function(e){ var r=e.target.closest(".row"); if(r) openPad(r.dataset.item); });
  $("padCancel").onclick=closePad;
  $("padSave").onclick=function(){ commit(); closePad(); };
  $("padBlank").onclick=function(){ padVal=""; commit(); closePad(); };
  $("padNext").onclick=function(){
    var cur=padItem; commit();
    var i=items.indexOf(items.filter(function(x){return x.name===cur.name;})[0]);
    if(i>-1 && i<items.length-1) openPad(items[i+1].name); else { closePad(); toast("That was the last item."); }
  };

  /* ---------- PIN screen ---------- */
  var pinVal="";
  buildPad($("pinKeys"), ["1","2","3","4","5","6","7","8","9","clr","0","back"], function(k){
    if(k==="back") pinVal=pinVal.slice(0,-1);
    else if(k==="clr") pinVal="";
    else if(pinVal.length<8) pinVal+=k;
    $("pinErr").textContent=""; drawPin();
  });
  (function(){ var b=$("pinKeys").querySelector('[data-k="clr"]'); b.textContent="Clear"; b.classList.add("fn"); b.setAttribute("aria-label","Clear PIN"); })();
  function drawPin(){
    var n=Math.max(4,pinVal.length), h="";
    for(var i=0;i<n;i++) h+='<span class="dot'+(i<pinVal.length?' on':'')+'"></span>';
    $("pinDots").innerHTML=h; $("pinCount").textContent=pinVal.length+" digits entered";
  }
  function showPin(msg){ pinVal=""; drawPin(); $("pinErr").textContent=msg||""; $("countPad").hidden=true; $("pinScreen").hidden=false; setStatus("PIN needed",true); }
  function hidePin(){ $("pinScreen").hidden=true; }
  $("pinGo").onclick=function(){
    if(pinVal.length<4){ $("pinErr").textContent="Enter at least 4 digits."; return; }
    pin=pinVal; $("pinGo").disabled=true; $("pinGo").textContent="Checking…";
    load().catch(function(e){
      if(e && e.badPin){ pin=""; store("del","stockPin"); showPin("That PIN didn't match the one saved in the script."); }
      else { pin=""; $("pinErr").textContent=explain(e); setStatus("Not connected",true); }
    }).then(function(){ $("pinGo").disabled=false; $("pinGo").textContent="Unlock"; });
  };

  document.addEventListener("keydown",function(e){
    if(e.key==="Escape" && !$("countPad").hidden) closePad();
  });

  /* ---------- Start ---------- */
  try{ var cache=JSON.parse(store("get","stockCache")||"null"); if(cache&&cache.items){ items=cache.items; counts=cache.counts||{}; } }catch(e){}
  render();
  if(!pin) showPin(); else load().catch(handleErr);
  // refresh from the sheet when the tablet wakes up / tab comes back
  document.addEventListener("visibilitychange",function(){ if(!document.hidden && pin && !busy && !Object.keys(pending).length) load().catch(handleErr); });
})();
</script>
</body>
</html>
