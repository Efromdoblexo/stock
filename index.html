<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>doblexo · Weekly Inventory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* Light theme to match the doblexo launcher */
:root{color-scheme:light;
  --blue:#0118bd;--pink:#FA7DE1;--pink-ink:#c2189f;--blue-soft:#e8ebff;--pink-soft:#fde8f8;
  --ink:#0b1240;--muted:#4a5078;--line:#e2e4f3;--field:#cfd4f5;
  --warn:#a00018;--warn-bg:#fff0f2;
  --shadow:0 2px 0 rgba(11,18,64,.04),0 10px 24px -14px rgba(1,24,189,.28)}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--ink);
  font:22px/1.35 "Nunito",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3,.tab,.big,.key,.row .val,.display{font-family:"Fredoka","Nunito",system-ui,sans-serif}
:focus-visible{outline:4px solid var(--pink);outline-offset:3px}
[hidden]{display:none !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Top band */
header{position:relative;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;
  padding:12px 20px 34px;background:linear-gradient(115deg,var(--blue-soft) 0%,#f3f0ff 45%,var(--pink-soft) 100%)}
header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:22px;background:#fff;
  -webkit-mask:radial-gradient(28px 18px at 50% 100%,#000 98%,transparent) 0 0/56px 22px repeat-x;
          mask:radial-gradient(28px 18px at 50% 100%,#000 98%,transparent) 0 0/56px 22px repeat-x}
.home{justify-self:start;display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;border-radius:18px;padding:4px 6px}
.home img{height:76px;width:auto;display:block}
.home span{font:800 16px/1 "Nunito",sans-serif;color:var(--blue);background:rgba(255,255,255,.75);padding:5px 12px;border-radius:999px}
.title{text-align:center}
h1{margin:0;font-size:44px;font-weight:600;line-height:1.05;color:var(--blue);letter-spacing:-.01em}
.due{display:inline-flex;align-items:center;gap:8px;margin-top:8px;background:var(--blue);color:#fff;border-radius:999px;
  padding:6px 16px;font:600 20px/1 "Fredoka",sans-serif;box-shadow:0 6px 14px -6px rgba(1,24,189,.6)}
.due small{font:800 13px/1 "Nunito",sans-serif;letter-spacing:.12em;opacity:.85}
.status{justify-self:end;font-size:18px;font-weight:800;padding:8px 16px;border-radius:999px;background:#fff;color:var(--blue);
  box-shadow:0 4px 12px -6px rgba(1,24,189,.35);white-space:nowrap}
.status.bad{background:var(--pink-ink);color:#fff}

/* Tabs: pill switch */
.tabs{display:flex;gap:8px;margin:8px auto 0;padding:7px;max-width:1100px;width:calc(100% - 32px);
  position:sticky;top:8px;z-index:5;background:var(--blue-soft);border-radius:999px;box-shadow:0 8px 20px -14px rgba(1,24,189,.45)}
.tab{flex:1;min-height:66px;border:0;border-radius:999px;background:transparent;color:var(--blue);font-size:26px;font-weight:600;transition:background .15s,color .15s}
.tab[aria-selected="true"]{background:var(--blue);color:#fff;box-shadow:0 6px 14px -6px rgba(1,24,189,.6)}

main{padding:4px 16px 150px;max-width:1100px;margin:0 auto}
h2{font-size:28px;font-weight:600;margin:28px 0 10px;color:var(--blue);display:flex;align-items:center;gap:12px}
h2::after{content:"";flex:1;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--blue-soft),transparent)}
.note{font-size:20px;font-weight:700;color:var(--muted);padding:14px 18px;border-radius:20px;background:var(--blue-soft);margin:16px 0 8px}
.note b{color:var(--blue)}
.note.start{display:flex;align-items:center;gap:12px;background:var(--pink-soft);color:var(--ink);border:2px solid #f8cdee;font-size:21px}
.note.start b{color:var(--pink-ink)}
.note.start span:first-child{font-size:28px}

/* Count / Bought rows */
.row{display:flex;align-items:center;gap:16px;width:100%;min-height:86px;margin:10px 0;
  padding:10px 12px 10px 20px;border:2px solid var(--line);border-radius:24px;background:#fff;box-shadow:var(--shadow);text-align:left;
  transition:background .15s,border-color .15s}
.row:active{background:var(--blue-soft)}
.row .name{flex:1;font-size:27px;font-weight:800}
.row .hint{display:block;font-size:18px;font-weight:700;color:var(--pink-ink)}
.row .val{min-width:140px;min-height:62px;padding:0 16px;border-radius:20px;
  display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:600;color:#fff;background:var(--blue)}
.row .val.empty{color:var(--blue);font:800 20px/1.1 "Nunito",sans-serif;background:var(--blue-soft);border:2px dashed #aab2ee}

/* Footer actions */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:rgba(255,255,255,.94);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 -10px 24px -18px rgba(1,24,189,.5);
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;gap:12px;justify-content:center}
.big{min-height:74px;padding:0 28px;border-radius:999px;font-size:26px;font-weight:600;border:0;
  background:var(--blue);color:#fff;flex:1;max-width:560px;box-shadow:0 10px 20px -10px rgba(1,24,189,.7)}
.big.ghost{background:var(--blue-soft);color:var(--blue);box-shadow:none}
.big.danger{background:var(--pink-ink);color:#fff;box-shadow:0 10px 20px -10px rgba(194,24,159,.7)}
.big[disabled]{opacity:.6}

/* Summary table */
.tablewrap{border:2px solid var(--line);border-radius:24px;box-shadow:var(--shadow);overflow:hidden;background:#fff}
table{width:100%;border-collapse:collapse;font-size:23px}
th{font:800 16px/1.2 "Nunito",sans-serif;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:right;padding:12px 10px;background:#f7f8ff}
th:first-child,td:first-child{text-align:left;padding-left:18px}
th:last-child,td:last-child{padding-right:18px}
td{padding:14px 10px;border-top:2px solid var(--line);text-align:right;font-weight:700;white-space:nowrap}
td:first-child{white-space:normal;font-weight:800}
td.dim{color:#7a7fa6;font-weight:700}
td.sugg{color:var(--pink-ink);font:600 30px/1 "Fredoka",sans-serif}

/* Overlays */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(11,18,64,.55);display:flex;align-items:center;justify-content:center;padding:12px}
.sheet{background:#fff;border-radius:32px;width:100%;max-width:560px;padding:24px;box-shadow:0 30px 70px -24px rgba(11,18,64,.6)}
.sheet h3{margin:0 0 4px;font-size:32px;font-weight:600;color:var(--blue)}
.sheet .sub{font-size:20px;color:var(--muted);font-weight:700;margin-bottom:14px}
.display{font-size:58px;font-weight:600;text-align:center;min-height:92px;line-height:88px;border:3px solid var(--field);
  border-radius:24px;margin-bottom:14px;letter-spacing:.03em;color:var(--blue);background:#fafbff}
.display.placeholder{color:#7a7fa6;font:700 26px/88px "Nunito",sans-serif}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.key{min-height:82px;border-radius:24px;border:0;background:var(--blue-soft);color:var(--blue);font-size:38px;font-weight:600}
.key:active{background:var(--pink);color:#fff}
.key.fn{font:800 22px/1 "Nunito",sans-serif}
.pad-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.pad-actions .big{max-width:none;font-size:24px}
.err{color:var(--warn);font-weight:800;font-size:21px;min-height:30px;text-align:center;margin:4px 0 8px}
#pinScreen{background:linear-gradient(135deg,#0118bd 0%,#7a3fd6 55%,#FA7DE1 100%)}
#pinScreen .sheet{text-align:center}
.dots{display:flex;justify-content:center;gap:16px;margin:10px 0 14px}
.dot{width:30px;height:30px;border-radius:50%;background:var(--blue-soft);border:3px solid var(--field)}
.dot.on{background:var(--blue);border-color:var(--blue)}
.toast{position:fixed;left:50%;bottom:112px;transform:translateX(-50%);z-index:30;background:var(--ink);color:#fff;
  padding:16px 26px;border-radius:999px;font-size:22px;font-weight:800;max-width:90vw;text-align:center;box-shadow:0 14px 30px -14px rgba(11,18,64,.7)}

@media (max-width:640px){
  html,body{font-size:19px}
  header{grid-template-columns:auto 1fr;padding:10px 14px 30px}
  header .status{grid-column:1 / -1;justify-self:center}
  .home img{height:56px}
  h1{font-size:34px}
  .row .name{font-size:23px}.row .val{min-width:110px}
  table{font-size:19px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>
(function(){
  "use strict";
  var API = "https://script.google.com/macros/s/AKfycbwmgrkHx9tG9KSXOK5bw4O9LrJMHXL7yEmo29Ug78LPMp_QCOVzhx9fKDpMqepX7oJT/exec";
  var VERSION = 10;
  var BUFFER = 1.2;   /* suggested buy covers average weekly use + 20% */

  /* Fallback item list, used until the sheet answers.
     A "Section" column in the sheet replaces these groups. */
  var DEFAULT_ITEMS = [
    {name:"Whole milk", section:"Milk & Dairy"},
    {name:"Fat free milk", section:"Milk & Dairy"},
    {name:"Oat milk", section:"Milk & Dairy"},
    {name:"Almond milk", section:"Milk & Dairy"},
    {name:"Heavy creams", section:"Milk & Dairy"},
    {name:"Lechera", section:"Milk & Dairy"},
    {name:"Vanilla bean honey", section:"Sweeteners"},
    {name:"Traditional honey", section:"Sweeteners"},
    {name:"Brown sugar", section:"Sweeteners"},
    {name:"Cane sugar", section:"Sweeteners"},
    {name:"Agave", section:"Sweeteners"},
    {name:"Biscoff cookies", section:"Toppings"},
    {name:"Graham crackers", section:"Toppings"},
    {name:"Fruity pebbles", section:"Toppings"},
    {name:"Espresso Beans", section:"Coffee & Matcha"},
    {name:"Cold brew beans", section:"Coffee & Matcha"},
    {name:"Cold brew concentrate", section:"Coffee & Matcha"},
    {name:"Matcha", section:"Coffee & Matcha"}
  ];

  var items = DEFAULT_ITEMS.slice();
  var data = {count:{}, bought:{}};     /* field -> name -> number */
  var usage = {};                       /* name -> {avg, weeks} */
  var pending = {};                     /* "field|name" -> number|"" */
  var pin = store("get","stockPin") || "";
  var retryTimer = null, busy = false, view = "count";

  function $(id){ return document.getElementById(id); }
  function store(op,k,v){ try{ if(op==="get") return localStorage.getItem(k); if(op==="set") localStorage.setItem(k,v); if(op==="del") localStorage.removeItem(k);}catch(e){} return null; }
  function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
  function num(v){ if(v===""||v===null||v===undefined) return null; var n=Number(v); return isFinite(n)?n:null; }
  function fmt(n){ return (Math.round(n*100)/100).toString(); }
  function saveCache(){ store("set","stockCache2",JSON.stringify({items:items,data:data,usage:usage})); }

  /* ---------- Server ---------- */
  function call(body){
    body.pin = pin;
    return fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify(body),redirect:"follow"})
      .catch(function(){ var e=new Error("network"); e.kind="network"; throw e; })
      .then(function(r){ return r.text(); })
      .then(function(t){
        var d;
        try{ d=JSON.parse(t); }catch(x){
          var e=new Error("notjson"); e.kind=/sign in|accounts\.google|ServiceLogin/i.test(t)?"signin":"notjson"; throw e;
        }
        if(isBadPin(d)){ var e2=new Error("bad_pin"); e2.badPin=true; throw e2; }
        if(d && d.ok===false){ var e3=new Error(d.error||"Script error"); e3.kind="script"; throw e3; }
        return d;
      });
  }
  function isBadPin(d){
    if(!d) return false;
    var s=((d.error||"")+" "+(d.message||"")).toLowerCase();
    if(/not set/.test(s)) return false;
    return d.ok===false && /bad_pin|bad pin|wrong pin|invalid pin|incorrect pin|unauth|forbidden|denied/.test(s);
  }
  function explain(e){
    if(!e) return "Something went wrong. Try again.";
    if(e.kind==="network") return "Can't reach the script. Check Wi-Fi, then try again.";
    if(e.kind==="signin") return "The script is asking for a Google sign-in. Redeploy it with access set to “Anyone”.";
    if(e.kind==="notjson") return "The script didn't send stock data back. Make sure the new Code.gs is deployed as a new version.";
    if(e.kind==="script") return "Script error: "+e.message;
    return e.message||"Something went wrong.";
  }
  function handleErr(e){
    if(e && e.badPin){ pin=""; store("del","stockPin"); showPin("That PIN didn't match the one saved in the script."); return; }
    if(e && e.kind==="script"){ setStatus("Not saved", true); toast(explain(e)); return; }
    setStatus("Not saved – retrying", true); toast(explain(e)); scheduleRetry();
  }

  function load(){
    setStatus("Loading…");
    return call({action:"get"}).then(function(d){
      applyServer(d); store("set","stockPin",pin);
      $("pinScreen").hidden=true; setStatus("Up to date"); render(); flush();
    });
  }
  function applyServer(d){
    var list = d.items || [];
    if(!list.length) return;
    var fresh = {count:{}, bought:{}}; usage = {};
    items = list.map(function(r){
      var name = r.name||r.item;
      var def = DEFAULT_ITEMS.filter(function(x){return x.name===name;})[0] || {};
      var c = num(r.count), b = num(r.bought);
      if(c!==null) fresh.count[name]=c;
      if(b!==null) fresh.bought[name]=b;
      if(num(r.avg)!==null) usage[name]={avg:num(r.avg), weeks:r.weeks||0};
      return {name:name, section:r.section||def.section||"Other"};
    });
    /* keep unsaved local edits on top */
    Object.keys(pending).forEach(function(k){
      var p=k.split("|"), f=p[0], n=p.slice(1).join("|");
      if(pending[k]==="") delete fresh[f][n]; else fresh[f][n]=pending[k];
    });
    data = fresh; saveCache();
  }
  function saveValue(field,name,val){
    if(val===null) delete data[field][name]; else data[field][name]=val;
    pending[field+"|"+name] = val===null ? "" : val;
    saveCache(); render(); flush();
  }
  function flush(){
    if(busy) return;
    var keys = Object.keys(pending);
    if(!keys.length){ setStatus("All saved"); return; }
    busy = true; setStatus("Saving…");
    var k = keys[0], p=k.split("|"), val = pending[k];
    call({action:"set", field:p[0], item:p.slice(1).join("|"), value:val}).then(function(){
      if(pending[k]===val) delete pending[k];
      busy=false; flush();
    }).catch(function(e){ busy=false; handleErr(e); });
  }
  function scheduleRetry(){
    clearTimeout(retryTimer);
    retryTimer = setTimeout(function(){ if(Object.keys(pending).length) flush(); else load().catch(handleErr); }, 15000);
  }
  window.addEventListener("online", function(){ flush(); });

  function startNewCount(){
    if(Object.keys(pending).length){ toast("Still saving. Try again in a moment."); flush(); return; }
    setStatus("Saving week…");
    call({action:"clear"}).then(function(){
      data={count:{},bought:{}}; pending={}; saveCache();
      toast("This week is saved to History. New count started.");
      return load();
    }).catch(function(e){
      if(e && e.badPin) return handleErr(e);
      setStatus("Could not start", true); toast(explain(e));
    });
  }

  function setStatus(t,bad){ var s=$("status"); s.textContent=t; s.className="status"+(bad?" bad":""); }
  function toast(t){ var el=$("toast"); el.textContent=t; el.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(function(){el.hidden=true;},3500); }

  /* ---------- Suggestion ---------- */
  function suggest(name){
    var u=usage[name], c=data.count[name];
    if(!u || c===undefined) return null;
    return Math.max(0, Math.ceil(u.avg*BUFFER - c));
  }
  function sections(list){
    var order=[], map={};
    list.forEach(function(it){ var s=it.section||"Other"; if(!map[s]){map[s]=[];order.push(s);} map[s].push(it); });
    return order.map(function(s){return {name:s,items:map[s]};});
  }

  /* ---------- Render ---------- */
  var FIELD = {
    count:{empty:"Tap to count", ask:"What's on the shelf now?", label:"on shelf"},
    bought:{empty:"Tap to add", ask:"How much did you buy this week?", label:"bought"}
  };
  function renderList(field){
    var html="", missing=0;
    if(field==="bought") html+='<div class="note">After shopping, enter how much you bought of each item, in the same unit you count it in. It is saved with this week’s count when a new count starts.</div>';
    sections(items).forEach(function(sec){
      html += '<h2>'+esc(sec.name)+'</h2>';
      sec.items.forEach(function(it){
        var v=data[field][it.name], has=v!==undefined;
        if(!has) missing++;
        var hint = field==="bought" && data.count[it.name]!==undefined
          ? '<span class="hint">On shelf: '+fmt(data.count[it.name])+(suggest(it.name)!==null?' · Suggested: '+suggest(it.name):'')+'</span>' : '';
        html += '<button class="row" data-field="'+field+'" data-item="'+esc(it.name)+'" aria-label="'+esc(it.name)+', '+(has?FIELD[field].label+' '+fmt(v):'not entered')+'. Tap to enter.">'+
          '<span class="name">'+esc(it.name)+hint+'</span>'+
          '<span class="val'+(has?'':' empty')+'">'+(has?fmt(v):FIELD[field].empty)+'</span></button>';
      });
    });
    if(field==="count" && missing) html = '<div class="note"><b>'+missing+'</b> of '+items.length+' items not counted yet.</div>'+html;
    if(field==="count") html = '<div class="note start"><span aria-hidden="true">👉</span><span>Please <b>double tap</b> <b>Start new count</b> (at the bottom) before starting a new count.</span></div>'+html;
    $("view-"+field).innerHTML = html;
  }
  function renderSummary(){
    var anyUsage = Object.keys(usage).length>0;
    var html = anyUsage
      ? '<div class="note">Avg use is per week, from your History. Suggested = avg use + 20%, minus what’s on the shelf. Compare it with what you bought. You decide.</div>'
      : '<div class="note">Avg use and suggested amounts appear after two weekly counts are saved (tap “Start new count” each week).</div>';
    sections(items).forEach(function(sec){
      html += '<h2>'+esc(sec.name)+'</h2><div class="tablewrap"><table><thead><tr><th scope="col">Item</th><th scope="col">On shelf</th><th scope="col">Bought</th><th scope="col">Avg use/wk</th><th scope="col">Suggested</th></tr></thead><tbody>';
      sec.items.forEach(function(it){
        var c=data.count[it.name], b=data.bought[it.name], u=usage[it.name], s=suggest(it.name);
        html += '<tr><td>'+esc(it.name)+'</td>'+
          '<td'+(c===undefined?' class="dim"':'')+'>'+(c===undefined?'Not counted':fmt(c))+'</td>'+
          '<td'+(b===undefined?' class="dim"':'')+'>'+(b===undefined?'–':fmt(b))+'</td>'+
          '<td'+(u?'':' class="dim"')+'>'+(u?fmt(Math.round(u.avg*10)/10):'–')+'</td>'+
          '<td class="'+(s===null?'dim':'sugg')+'">'+(s===null?'–':s)+'</td></tr>';
      });
      html += '</tbody></table></div>';
    });
    $("view-summary").innerHTML = html;
  }
  function render(){ renderList("count"); renderList("bought"); renderSummary(); }

  function summaryText(){
    var lines=["doblexo stock count – "+new Date().toLocaleDateString()];
    sections(items).forEach(function(sec){
      lines.push("", sec.name.toUpperCase());
      sec.items.forEach(function(it){
        var c=data.count[it.name], b=data.bought[it.name], u=usage[it.name], s=suggest(it.name);
        var parts=[c===undefined?"not counted":"have "+fmt(c)];
        if(b!==undefined) parts.push("bought "+fmt(b));
        if(u) parts.push("uses ~"+fmt(Math.round(u.avg*10)/10)+"/wk");
        if(s!==null) parts.push("suggest "+s);
        lines.push("- "+it.name+": "+parts.join(" · "));
      });
    });
    return lines.join("\n");
  }
  function copyText(t){
    function fallback(){
      var ta=document.createElement("textarea"); ta.value=t; ta.setAttribute("readonly","");
      ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select();
      var ok=false; try{ ok=document.execCommand("copy"); }catch(e){}
      document.body.removeChild(ta); return ok;
    }
    if(navigator.clipboard && window.isSecureContext){
      return navigator.clipboard.writeText(t).then(function(){return true;},function(){return fallback();});
    }
    return Promise.resolve(fallback());
  }

  /* ---------- Tabs ---------- */
  function show(v){
    view=v;
    ["count","bought","summary"].forEach(function(k){
      $("tab-"+k).setAttribute("aria-selected", k===v);
      $("view-"+k).hidden = k!==v;
    });
    $("bar-count").hidden = v!=="count";
    $("bar-summary").hidden = v!=="summary";
    window.scrollTo(0,0);
  }
  Array.prototype.forEach.call(document.querySelectorAll(".tab"),function(t){ t.onclick=function(){ show(t.dataset.view); }; });
  $("copyBtn").onclick=function(){ copyText(summaryText()).then(function(ok){ toast(ok?"Summary copied.":"Couldn't copy on this device."); }); };

  /* ---------- Start new count (two taps) ---------- */
  var armTimer=null;
  $("newCountBtn").onclick=function(){
    var b=this;
    if(b.dataset.armed){ clearTimeout(armTimer); disarm(); startNewCount(); return; }
    b.dataset.armed="1"; b.className="big danger"; b.textContent="Tap again to save this week & start new";
    armTimer=setTimeout(disarm,5000);
  };
  function disarm(){ var b=$("newCountBtn"); delete b.dataset.armed; b.className="big ghost"; b.textContent="Start new count"; }

  /* ---------- Number keypad ---------- */
  var padItem=null, padField="count", padVal="";
  function buildPad(el, keys, onKey){
    el.innerHTML = keys.map(function(k){
      var label = k==="back"?"⌫":k, aria = k==="back"?"Delete":k==="."?"Decimal point":k;
      return '<button class="key'+(k==="back"?" fn":"")+'" data-k="'+k+'" aria-label="'+aria+'">'+label+'</button>';
    }).join("");
    el.onclick=function(e){ var b=e.target.closest(".key"); if(b) onKey(b.dataset.k); };
  }
  buildPad($("padKeys"), ["1","2","3","4","5","6","7","8","9",".","0","back"], function(k){
    if(k==="back") padVal=padVal.slice(0,-1);
    else if(k==="."){ if(padVal.indexOf(".")<0) padVal=(padVal||"0")+"."; }
    else if(padVal.length<7) padVal = (padVal==="0"?"":padVal)+k;
    drawPad();
  });
  function drawPad(){
    var d=$("padDisplay");
    if(padVal===""){ d.textContent="Type amount"; d.className="display placeholder"; }
    else { d.textContent=padVal; d.className="display"; }
  }
  function openPad(field,name){
    var it=items.filter(function(x){return x.name===name;})[0]; if(!it) return;
    padItem=it; padField=field;
    var cur=data[field][name];
    padVal = cur!==undefined ? fmt(cur) : "";
    $("padTitle").textContent=it.name;
    var sub=FIELD[field].ask;
    if(field==="bought"){ var s=suggest(name); if(s!==null) sub+=" (suggested "+s+")"; }
    $("padSub").textContent=sub;
    drawPad(); $("numPad").hidden=false; $("padSave").focus();
  }
  function closePad(){
    $("numPad").hidden=true;
    var r=padItem&&document.querySelector('#view-'+padField+' .row[data-item="'+CSS.escape(padItem.name)+'"]');
    padItem=null; if(r) r.focus();
  }
  function commit(){
    if(!padItem) return;
    var v=padVal===""?null:num(padVal.replace(/\.$/,""));
    saveValue(padField,padItem.name,v);
  }
  ["count","bought"].forEach(function(f){
    $("view-"+f).addEventListener("click",function(e){ var r=e.target.closest(".row"); if(r) openPad(f, r.dataset.item); });
  });
  $("padCancel").onclick=closePad;
  $("padSave").onclick=function(){ commit(); closePad(); };
  $("padBlank").onclick=function(){ padVal=""; commit(); closePad(); };
  $("padNext").onclick=function(){
    var cur=padItem, f=padField; commit();
    var i=items.map(function(x){return x.name;}).indexOf(cur.name);
    if(i>-1 && i<items.length-1) openPad(f, items[i+1].name);
    else { closePad(); toast("That was the last item."); }
  };

  /* ---------- PIN screen ---------- */
  var pinVal="";
  buildPad($("pinKeys"), ["1","2","3","4","5","6","7","8","9","clr","0","back"], function(k){
    if(k==="back") pinVal=pinVal.slice(0,-1);
    else if(k==="clr") pinVal="";
    else if(pinVal.length<8) pinVal+=k;
    $("pinErr").textContent=""; drawPin();
  });
  (function(){ var b=$("pinKeys").querySelector('[data-k="clr"]'); b.textContent="Clear"; b.classList.add("fn"); b.setAttribute("aria-label","Clear PIN"); })();
  function drawPin(){
    var n=Math.max(4,pinVal.length), h="";
    for(var i=0;i<n;i++) h+='<span class="dot'+(i<pinVal.length?' on':'')+'"></span>';
    $("pinDots").innerHTML=h; $("pinCount").textContent=pinVal.length+" digits entered";
  }
  function showPin(msg){
    pinVal=""; drawPin(); $("pinErr").textContent=msg||"";
    $("numPad").hidden=true; $("pinScreen").hidden=false; setStatus("PIN needed",true);
  }
  $("pinGo").onclick=function(){
    if(pinVal.length<4){ $("pinErr").textContent="Enter at least 4 digits."; return; }
    pin=pinVal; $("pinGo").disabled=true; $("pinGo").textContent="Checking…";
    load().catch(function(e){
      if(e && e.badPin){ pin=""; store("del","stockPin"); showPin("That PIN didn't match the one saved in the script."); }
      else { pin=""; $("pinErr").textContent=explain(e); setStatus("Not connected",true); }
    }).then(function(){ $("pinGo").disabled=false; $("pinGo").textContent="Unlock"; });
  };
  document.addEventListener("keydown",function(e){ if(e.key==="Escape" && !$("numPad").hidden) closePad(); });

  /* ---------- Start ---------- */
  $("ver").textContent = "Page version "+VERSION+" · script …" + (API.split("/s/")[1]||"preview").slice(-10, -5);
  try{
    var cache=JSON.parse(store("get","stockCache2")||"null");
    if(cache&&cache.items){ items=cache.items; data=cache.data||data; usage=cache.usage||{}; }
  }catch(e){}
  render();
  if(!pin) showPin(); else load().catch(handleErr);
  document.addEventListener("visibilitychange",function(){
    if(!document.hidden && pin && !busy && !Object.keys(pending).length) load().catch(handleErr);
  });
})();
</script>
</body>
</html>
